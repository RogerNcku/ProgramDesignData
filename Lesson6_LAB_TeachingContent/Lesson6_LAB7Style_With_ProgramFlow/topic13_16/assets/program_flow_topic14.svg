<text x="390" y="135" font-size="19" fill="#334155"><tspan x="390" dy="32">1. 輸入多棵 Tree</tspan><tspan x="390" dy="32">2. 加入 Pseudo Root 概念</tspan><tspan x="390" dy="32">3. 每棵樹轉 LCRS</tspan><tspan x="390" dy="32">4. 第一棵樹成為左子</tspan><tspan x="390" dy="32">5. 下一棵樹成為右兄弟</tspan><tspan x="390" dy="32">6. 移除 Pseudo Root 完成 Forest 表示</tspan></text>
