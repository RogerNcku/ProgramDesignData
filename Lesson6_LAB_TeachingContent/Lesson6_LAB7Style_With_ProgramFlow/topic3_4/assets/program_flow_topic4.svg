<text x="390" y="135" font-size="19" fill="#334155"><tspan x="390" dy="32">1. 輸入節點順序</tspan><tspan x="390" dy="32">2. 選擇 Array 或 Linked</tspan><tspan x="390" dy="32">3. Array：依 index 放入節點</tspan><tspan x="390" dy="32">4. Linked：配置 TreeNode</tspan><tspan x="390" dy="32">5. 設定 left / right child</tspan><tspan x="390" dy="32">6. 完成儲存結構</tspan></text>
