230" height="58" rx="26" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="195.0" y="549" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">輸出 Tree 結構</text><text x="195.0" y="571" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">摘要</text>
