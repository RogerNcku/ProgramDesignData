<text x="390" y="110" font-size="25" font-weight="900" fill="#0f766e">流程閱讀重點</text>
<text x="390" y="135" font-size="19" fill="#334155"><tspan x="390" dy="32">1. 開始讀入節點資料</tspan><tspan x="390" dy="32">2. 指定 Root 根節點</tspan><tspan x="390" dy="32">3. 建立 Parent / Child 關係</tspan><tspan x="390" dy="32">4. 判斷 Leaf 與 Internal Node</tspan><tspan x="390" dy="32">5. 計算 Degree / Level / Height</tspan><tspan x="390" dy="32">6. 輸出 Tree 結構摘要</tspan></text>
