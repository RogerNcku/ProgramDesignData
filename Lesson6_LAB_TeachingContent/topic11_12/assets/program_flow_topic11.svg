<text x="390" y="110" font-size="25" font-weight="900" fill="#0f766e">流程閱讀重點</text>
<text x="390" y="135" font-size="19" fill="#334155"><tspan x="390" dy="32">1. 讀入 heap 資料</tspan><tspan x="390" dy="32">2. 自底向上 Heapify</tspan><tspan x="390" dy="32">3. Push 時放到最後</tspan><tspan x="390" dy="32">4. 向上比較交換</tspan><tspan x="390" dy="32">5. Pop 時移除最大值</tspan><tspan x="390" dy="32">6. 向下調整完成 Max Heap</tspan></text>
<rect x="360" y="440" width="680" height="48" rx="18" fill="#ecfdf5" stroke="#a7f3d0"/>
<text x="700" y="471" text-anchor="middle" font-size="19" font-weight="800" fill="#047857">先看資料如何建立，再看條件判斷與指標/陣列如何更新。</text>
