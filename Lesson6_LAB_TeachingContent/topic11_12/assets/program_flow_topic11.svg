<text x="56" y="38" font-size="26" font-weight="900" fill="#1e3a8a">Lesson 6 主題 11：Max Heap 建立、插入、刪除流程</text>
<rect x="80" y="65" width="230" height="58" rx="26" fill="#e8f1ff" stroke="#4776e6" stroke-width="3"/><text x="195.0" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">讀入 heap 資料</text><path d="M 195.0 123 L 195.0 149" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="157" width="230" height="58" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="195.0" y="181" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">自底向上 Heapi</text><text x="195.0" y="203" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">fy</text><path d="M 195.0 215 L 195.0 241" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="249" width="230" height="58" rx="14" fill="#e8f1ff" stroke="#4776e6" stroke-width="3"/><text x="195.0" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">Push 時放到最後</text><path d="M 195.0 307 L 195.0 333" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="341" width="230" height="58" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="195.0" y="377" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">向上比較交換</text><path d="M 195.0 399 L 195.0 425" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="433" width="230" height="58" rx="14" fill="#e8f1ff" stroke="#4776e6" stroke-width="3"/><text x="195.0" y="469" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">Pop 時移除最大值</text><path d="M 195.0 491 L 195.0 517" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/><rect x="80" y="525" width="230" height="58" rx="26" fill="#fff7ed" stroke="#f59e0b" stroke-width="3"/><text x="195.0" y="549" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44">向下調整完成 Max</text><text x="195.0" y="571" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2a44"> Heap</text>
