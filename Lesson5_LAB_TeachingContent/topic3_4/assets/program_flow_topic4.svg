<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.18"/></filter>
 <marker id="arrow" markerWidth="16" markerHeight="16" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b4a6b"/></marker>
 <style>text{font-family:'Noto Sans TC','Microsoft JhengHei',Arial,sans-serif;} .title{font-size:34px;font-weight:800;fill:#1f2a44;} .subtitle{font-size:18px;fill:#52607a;} .boxtext{font-size:22px;font-weight:700;fill:#1f2a44;} .small{font-size:16px;fill:#52607a;}</style>
</defs>
<rect width="1200" height="820" rx="34" fill="#f7f9ff"/>
<text x="600" y="42" text-anchor="middle" class="title">程式流程圖：Singly Linked List 插入與刪除</text>
<text x="600" y="72" text-anchor="middle" class="subtitle">依照程式執行順序，從開始、判斷、處理到輸出結果</text>
<rect x="470" y="70" width="260" height="70" rx="22" fill="#E8F1FF" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="112" text-anchor="middle" class="boxtext">開始</text><line x1="600" y1="146" x2="600" y2="168" stroke="#3b4a6b" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="178" width="260" height="70" rx="22" fill="#FFF4DC" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="220" text-anchor="middle" class="boxtext">尋找目標位置</text><line x1="600" y1="254" x2="600" y2="276" stroke="#3b4a6b" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="286" width="260" height="70" rx="22" fill="#EAFBEA" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="328" text-anchor="middle" class="boxtext">判斷插入/刪除</text><line x1="600" y1="362" x2="600" y2="384" stroke="#3b4a6b" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="394" width="260" height="70" rx="22" fill="#FCEBFF" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="436" text-anchor="middle" class="boxtext">插入：配置新節點</text><line x1="600" y1="470" x2="600" y2="492" stroke="#3b4a6b" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="502" width="260" height="70" rx="22" fill="#E8FFF8" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="544" text-anchor="middle" class="boxtext">刪除：重接前後節點</text><line x1="600" y1="578" x2="600" y2="600" stroke="#3b4a6b" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="610" width="260" height="70" rx="22" fill="#FFF0F0" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="652" text-anchor="middle" class="boxtext">釋放刪除節點</text><line x1="600" y1="686" x2="600" y2="708" stroke="#3b4a6b" stroke-width="4" marker-end="url(#arrow)"/><rect x="470" y="718" width="260" height="70" rx="22" fill="#EEF0FF" stroke="#53648a" stroke-width="3" filter="url(#shadow)"/><text x="600" y="760" text-anchor="middle" class="boxtext">輸出串列</text><g transform="translate(830,132)"><rect x="0" y="0" width="280" height="210" rx="20" fill="#ffffff" stroke="#d8def0" stroke-width="2" filter="url(#shadow)"/><text x="140" y="38" text-anchor="middle" class="boxtext">閱讀方式</text><text x="26" y="78" class="small">1. 由上往下看。</text><text x="26" y="112" class="small">2. 菱形概念代表判斷。</text><text x="26" y="146" class="small">3. 箭頭代表下一步。</text><text x="26" y="180" class="small">4. 最後用輸出檢查結果。</text></g></svg>